name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No build step: Pyodide runs the Python labs and the page runs the JS labs as they are.
      # Mirror the repo layout so web/pyodide.toml and app.js can load ../scripts/*
      - name: Assemble site
        run: |
          mkdir -p _site/web
          cp web/*.html web/*.js web/*.py web/*.toml web/*.svg _site/web/
          cp -r scripts _site/
          find _site -name '__pycache__' -prune -exec rm -rf {} +
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./web/"><title>Algorithms Labs</title><link rel="icon" href="./web/icon.svg"><a href="./web/">Open the showcase</a>' > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
